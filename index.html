<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FEP Mejoras">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>FEP Mejoras</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--line:#24304d;--tx:#e8efff;--mut:#8fa3cc;--ac:#38bdf8;--ok:#34d399;--or:#ff8c00}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 8px}h1{font-size:24px}header p{color:var(--mut);font-size:13px;margin-top:2px}
main{padding:8px 16px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1424ee;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}
nav button{flex:1;padding:10px 0 8px;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600}nav button b{display:block;font-size:22px}nav .on{color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px;font-weight:600}.chip.on{background:var(--ac);color:#04121f;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:flex-start}.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:transparent;font-size:15px;margin-top:1px}
.done .chk{background:var(--ok);border-color:var(--ok);color:#04121f}.done .t{text-decoration:line-through;color:var(--mut)}
.t{flex:1;line-height:1.35;font-weight:500}.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#1f2b47;color:var(--ac);margin-bottom:5px}
.hot .tag{background:#3b2400;color:var(--or)}
.cmd{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#080c16;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;word-break:break-all;color:#9be7ff}
.btn{padding:11px 16px;border-radius:12px;border:0;background:var(--ac);color:#04121f;font-weight:700;font-size:15px}.btn.g{background:#1f2b47;color:var(--tx)}.btn.w{width:100%}
.sm{color:var(--mut);font-size:12.5px}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#04121f;font-size:30px;font-weight:700;box-shadow:0 8px 24px #0008}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}
#m>div{width:100%;max-width:640px;margin:0 auto;background:#10172a;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
input,textarea,select{width:100%;background:#0a1020;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:6px 0 12px}textarea{min-height:110px}label{font-size:12px;color:var(--mut);font-weight:700}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:99}#toast.on{opacity:1}
</style></head><body>
<header><h1 id="h1"></h1><p id="hp"></p></header><main id="main"></main>
<button class="fab" id="fab">＋</button><div id="m"><div id="mc"></div></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const CATS=["Hook","Tomas","Subtítulos","Sonido","Música","Color","Estructura","Entrega","Otra"];
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S;try{S=JSON.parse(localStorage.getItem("vl")||"null")}catch(e){}
S=S||{};S.mejoras=S.mejoras||[];S.chats=S.chats||[];
const save=()=>{try{localStorage.setItem("vl",JSON.stringify(S))}catch(e){}};
let tab="mejoras",cat="Todas",showDone=false;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Copiado ✅")}
function modal(h){$("#mc").innerHTML=h;$("#m").classList.add("on")}function closeM(){$("#m").classList.remove("on")}
$("#m").onclick=e=>{if(e.target.id==="m")closeM()};
function render(){
 $("#nav").innerHTML=[["mejoras","✂️","Mejoras"],["chats","💬","Chats"],["mas","⚙️","Más"]].map(([k,i,n])=>`<button class="${tab===k?"on":""}" data-t="${k}"><b>${i}</b>${n}</button>`).join("");
 $("#fab").style.display=tab==="mas"?"none":"";
 const m=$("#main");
 if(tab==="mejoras"){
  const pend=S.mejoras.filter(x=>!x.done).length;$("#h1").textContent="✂️ FEP Mejoras";$("#hp").textContent=`${pend} pendientes · ${S.mejoras.length-pend} hechas`;
  let l=S.mejoras.filter(x=>(cat==="Todas"||x.cat===cat)&&(showDone||!x.done));
  l.sort((a,b)=>a.done-b.done||(b.prio||0)-(a.prio||0));
  m.innerHTML=`<div class="chips">${["Todas",...CATS].map(c=>`<div class="chip ${cat===c?"on":""}" data-cat="${c}">${c}</div>`).join("")}<div class="chip ${showDone?"on":""}" data-sd="1">✓ Hechas</div></div>`+
  (l.map(x=>`<div class="card ${x.done?"done":""} ${x.prio>=3?"hot":""}"><div class="row"><div class="chk" data-tg="${x.id}">✓</div><div class="t" data-ed="${x.id}"><span class="tag">${esc(x.cat)}${x.prio>=3?" · importante":""}</span><br>${esc(x.text)}</div></div></div>`).join("")||`<div class="empty">Nada pendiente 🎉<br>Pulsa ＋ para apuntar una mejora</div>`);
 }else if(tab==="chats"){
  $("#h1").textContent="💬 Chats del terminal";$("#hp").textContent="Para no perder el hilo y seguir hablando";
  const l=[...S.chats].sort((a,b)=>(b.pin||0)-(a.pin||0)||(b.date||"").localeCompare(a.date||""));
  m.innerHTML=`<div class="card"><b>Cómo seguir una conversación</b><div class="sm" style="margin-top:6px;line-height:1.5">1. Toca <b>Copiar comando</b>.<br>2. Pégalo en la Terminal del Mac y pulsa Enter.<br>3. Sigues justo donde lo dejaste.</div></div>`+
  (l.map(c=>`<div class="card"><div class="row"><div class="t"><b>${c.pin?"📌 ":""}${esc(c.title)}</b>${c.note?`<div class="sm" style="margin-top:4px">${esc(c.note)}</div>`:""}<div class="sm" style="margin-top:4px">${esc(c.date||"")}</div></div></div>
  <div class="cmd">${esc(c.cmd)}</div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-cp="${c.id}">Copiar comando</button><button class="btn g" data-pin="${c.id}">${c.pin?"Quitar 📌":"📌"}</button><button class="btn g" data-edc="${c.id}">✎</button></div></div>`).join("")||`<div class="empty">Sin chats guardados.<br>Pulsa ＋ o usa Más &gt; Importar</div>`);
 }else{
  $("#h1").textContent="⚙️ Más";$("#hp").textContent="Copias y datos";
  m.innerHTML=`<div class="card"><b>📥 Importar</b><div class="sm" style="margin:6px 0 10px">Pega el código que te da el Mac (mejoras y/o chats).</div><button class="btn w" data-imp="1">Importar</button></div>
  <div class="card"><b>📤 Copia de seguridad</b><div class="sm" style="margin:6px 0 10px">Copia todo para guardarlo (Notas, mensaje…).</div><button class="btn w g" data-exp="1">Copiar todo</button></div>
  <div class="card sm">Todo se guarda solo en este móvil. Funciona sin internet.</div>`;
 }
}
function formM(){ // añadir
 if(tab==="mejoras")modal(`<h3>Nueva mejora</h3><label>QUÉ HAY QUE MEJORAR</label><textarea id="f1" autofocus></textarea><label>CATEGORÍA</label><select id="f2">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><label><input type="checkbox" id="f3" style="width:auto;margin:0 8px 0 0"> Importante</label><br><br><button class="btn w" id="ok">Guardar</button>`);
 else modal(`<h3>Nuevo chat</h3><label>TÍTULO</label><input id="f1"><label>DÓNDE ME QUEDÉ (opcional)</label><textarea id="f4"></textarea><label>COMANDO</label><input id="f2" value="cd ~ &amp;&amp; claude --continue"><br><button class="btn w" id="ok">Guardar</button>`);
 $("#ok").onclick=()=>{const v=$("#f1").value.trim();if(!v)return;
  if(tab==="mejoras")S.mejoras.push({id:uid(),text:v,cat:$("#f2").value,prio:$("#f3").checked?3:1,done:0});
  else S.chats.push({id:uid(),title:v,note:$("#f4").value.trim(),cmd:$("#f2").value,date:new Date().toISOString().slice(0,16).replace("T"," ")});
  save();closeM();render()}}
function editM(id){const x=S.mejoras.find(i=>i.id===id);
 modal(`<h3>Editar</h3><textarea id="f1">${esc(x.text)}</textarea><select id="f2">${CATS.map(c=>`<option ${c===x.cat?"selected":""}>${c}</option>`).join("")}</select><label><input type="checkbox" id="f3" ${x.prio>=3?"checked":""} style="width:auto;margin:0 8px 0 0"> Importante</label><br><br><button class="btn w" id="ok">Guardar</button><br><br><button class="btn w g" id="dl">Borrar</button>`);
 $("#ok").onclick=()=>{x.text=$("#f1").value.trim()||x.text;x.cat=$("#f2").value;x.prio=$("#f3").checked?3:1;save();closeM();render()};
 $("#dl").onclick=()=>{S.mejoras=S.mejoras.filter(i=>i.id!==id);save();closeM();render()}}
function editC(id){const x=S.chats.find(i=>i.id===id);
 modal(`<h3>Editar chat</h3><label>TÍTULO</label><input id="f1" value="${esc(x.title)}"><label>DÓNDE ME QUEDÉ</label><textarea id="f4">${esc(x.note||"")}</textarea><label>COMANDO</label><input id="f2" value="${esc(x.cmd)}"><button class="btn w" id="ok">Guardar</button><br><br><button class="btn w g" id="dl">Borrar</button>`);
 $("#ok").onclick=()=>{x.title=$("#f1").value.trim()||x.title;x.note=$("#f4").value.trim();x.cmd=$("#f2").value;save();closeM();render()};
 $("#dl").onclick=()=>{S.chats=S.chats.filter(i=>i.id!==id);save();closeM();render()}}
function importM(){modal(`<h3>Importar</h3><label>PEGA EL CÓDIGO</label><textarea id="f1"></textarea><button class="btn w" id="ok">Importar</button>`);
 $("#ok").onclick=()=>{let o;try{o=JSON.parse($("#f1").value.trim())}catch(e){return toast("Código no válido")}
  ["mejoras","chats"].forEach(c=>(o[c]||[]).forEach(it=>{const i=S[c].findIndex(x=>x.id===it.id);if(i<0)S[c].push(it);else S[c][i]={...S[c][i],...it,done:S[c][i].done??it.done}}));
  save();closeM();render();toast("Importado ✅")}}
document.addEventListener("click",e=>{const t=e.target;let el;
 if(el=t.closest("[data-t]")){tab=el.dataset.t;return render()}
 if(el=t.closest("[data-cat]")){cat=el.dataset.cat;return render()}
 if(t.closest("[data-sd]")){showDone=!showDone;return render()}
 if(el=t.closest("[data-tg]")){const x=S.mejoras.find(i=>i.id===el.dataset.tg);x.done=x.done?0:1;save();return render()}
 if(el=t.closest("[data-ed]"))return editM(el.dataset.ed);
 if(el=t.closest("[data-cp]"))return copy(S.chats.find(i=>i.id===el.dataset.cp).cmd);
 if(el=t.closest("[data-pin]")){const x=S.chats.find(i=>i.id===el.dataset.pin);x.pin=x.pin?0:1;save();return render()}
 if(el=t.closest("[data-edc]"))return editC(el.dataset.edc);
 if(t.closest("[data-imp]"))return importM();
 if(t.closest("[data-exp]"))return copy(JSON.stringify({mejoras:S.mejoras,chats:S.chats}));
 if(t.closest("#fab"))return formM()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* migrar datos del antiguo Organizador (una vez) */
try{if(!localStorage.getItem("vlmig")){localStorage.setItem("vlmig",1);const o=JSON.parse(localStorage.getItem("org")||"null");
 if(o){(o.ideas||[]).filter(x=>!x.del&&x.status!=="hecha").forEach(x=>{const t=(x.title||"")+(x.desc?" — "+x.desc:"");
   if(/claude\s+(--continue|--resume)/.test(x.desc||"")||/claude\s+(--continue|--resume)/.test(x.title||""))S.chats.push({id:"o"+x.id,title:x.title,note:"",cmd:(x.desc||"cd ~ && claude --continue"),date:x.d||""});
   else S.mejoras.push({id:"o"+x.id,text:t,cat:"Otra",prio:x.prio>=3?3:1,done:0})});
  (o.notes||[]).filter(x=>!x.del&&x.title!=="Bienvenido 👋").forEach(x=>{if(/claude\s+(--continue|--resume)/.test(x.body||""))S.chats.push({id:"o"+x.id,title:x.title,note:"",cmd:x.body.trim(),date:""});
   else S.mejoras.push({id:"o"+x.id,text:(x.title||"")+(x.body?" — "+x.body:""),cat:"Otra",prio:1,done:0})});
  save()}}}catch(e){}
render();
</script></body></html>
